services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    env_file:
      - .env
    depends_on:
      - db
      - cache
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    restart: unless-stopped

  cache:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - .env
    command: redis-server --requirepass $${REDIS_PASSWORD}
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
